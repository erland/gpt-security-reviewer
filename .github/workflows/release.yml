name: Release distribution

on:
  release:
    types: [published]

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release version
        run: echo "RELEASE_VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"

      - name: Install report dependencies
        run: |
          pip install -r requirements-reporting.txt
          pip install pyyaml jsonschema

      - name: Install LibreOffice for PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install pinned GPT Byggaren 1.6.33 engine
        run: |
          curl --fail --location --retry 3 --output /tmp/gpt-byggaren-engine-1.6.33.zip \
            https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip
          python3 -m zipfile -e /tmp/gpt-byggaren-engine-1.6.33.zip /tmp/gpt-byggaren-engine
          python3 /tmp/gpt-byggaren-engine/scripts/install_distribution_engine.py --source /tmp/gpt-byggaren-engine --project-root .

      - name: Validate canonical project model
        run: python3 /tmp/gpt-byggaren-engine/scripts/lint_gpt_project.py --project-root .

      - name: Validate GPT Builder project model
        run: python3 scripts/lint_gpt_project.py

      - name: Validate project
        run: python3 scripts/validate_project.py

      - name: Validate workflows
        run: python3 scripts/validate_workflows.py

      - name: Validate RC readiness
        run: python3 scripts/validate_rc_readiness.py

      - name: Validate report model
        run: python3 scripts/validate_report_model.py

      - name: Validate system overview
        run: python3 scripts/validate_system_overview.py

      - name: Validate audience reporting
        run: python3 scripts/validate_audience_reporting.py

      - name: Validate multi-pass review
        run: python3 scripts/validate_multi_pass_review.py

      - name: Validate review integrity
        run: python3 scripts/validate_review_integrity.py

      - name: Validate report layout policy
        run: python3 scripts/validate_report_layout.py

      - name: Validate report exports
        run: python3 scripts/validate_report_exports.py

      - name: Validate Word/PDF exports
        run: python3 scripts/validate_binary_report_exports.py

      - name: Validate report workflow
        run: python3 scripts/validate_report_workflow.py

      - name: Validate report semantic parity
        run: python3 scripts/validate_report_semantic_parity.py

      - name: Validate test suite
        run: python3 scripts/validate_tests.py

      - name: Validate GPT Builder model robustness evals
        run: python3 scripts/validate_model_robustness_evals.py

      - name: Validate defensive reporting
        run: python3 scripts/validate_defensive_reporting.py

      - name: Validate security runtime parity
        run: python3 scripts/validate_runtime_parity.py

      - name: Build canonical project and five distributions
        run: python3 scripts/build_distributions.py --project-root . --version "${RELEASE_VERSION#v}"

      - name: Validate canonical distributions
        run: python3 scripts/validate_distributions.py --project-root .

      - name: Build standalone report engine
        run: python3 scripts/build_report_engine.py --version "${RELEASE_VERSION:-v0.0.0-ci}"

      - name: Verify standalone report engine
        run: python3 scripts/validate_report_engine.py --version "${RELEASE_VERSION:-v0.0.0-ci}"

      - name: Run report tools from packaged runtime ZIPs
        run: python3 scripts/validate_packaged_report_tools.py

      - name: Validate canonical delivery
        run: python3 /tmp/gpt-byggaren-engine/scripts/validate_generated_delivery.py --project-root .

      - name: Run packaged report end-to-end acceptance test
        run: python3 scripts/validate_packaged_report_e2e.py

      - name: Validate canonical release readiness
        run: python3 scripts/validate_release_readiness.py

      - name: Verify canonical reproducible release
        run: python3 scripts/verify_reproducible_build.py

      - name: Revalidate canonical distributions after reproducibility builds
        run: python3 scripts/validate_distributions.py --project-root .

      - name: Validate project hygiene
        run: python3 scripts/project_hygiene.py

      - name: Validate workflow parity
        run: python3 scripts/validate_workflow_parity.py

      - name: Rebuild and verify report engine after reproducibility checks
        run: |
          python3 scripts/build_report_engine.py --version "${RELEASE_VERSION#v}"
          python3 scripts/validate_report_engine.py --version "${RELEASE_VERSION#v}" --structure-only
          test -s "dist/security-reviewer-engine-${RELEASE_VERSION#v}.zip"

      - name: Upload six canonical release packages and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/security-reviewer-project-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-chat-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-plugin-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-engine-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-claude-project-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-claude-skills-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-opencode-${RELEASE_VERSION#v}.zip" \
            "dist/SHA256SUMS.txt" \
            "dist/DELIVERY-MANIFEST.json" \
            --clobber
      - name: Build canonical project and five distributions
        run: python3 scripts/build_distributions.py --project-root . --version "${RELEASE_VERSION#v}"

      - name: Validate canonical distributions
        run: python3 scripts/validate_distributions.py --project-root .

      - name: Validate canonical delivery
        run: python3 /tmp/gpt-byggaren-engine/scripts/validate_generated_delivery.py --project-root .

      - name: Validate canonical release readiness
        run: python3 scripts/validate_release_readiness.py

      - name: Verify canonical reproducible release
        run: python3 scripts/verify_reproducible_build.py

      - name: Revalidate canonical distributions after reproducibility builds
        run: python3 scripts/validate_distributions.py --project-root .

      - name: Validate project hygiene
        run: python3 scripts/project_hygiene.py

      - name: Validate workflow parity
        run: python3 scripts/validate_workflow_parity.py

      - name: Upload six canonical release packages and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/security-reviewer-project-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-chat-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-plugin-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-claude-project-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-claude-skills-${RELEASE_VERSION#v}.zip" \
            "dist/security-reviewer-opencode-${RELEASE_VERSION#v}.zip" \
            "dist/SHA256SUMS.txt" \
            "dist/DELIVERY-MANIFEST.json" \
            --clobber
