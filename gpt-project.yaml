schema_version: 1
project:
  id: security-reviewer
  name: Säkerhetsgranskaren för IT-stöd
  description: Evidensbaserad och defensiv säkerhetsgranskning av källkod, konfiguration, deploymentunderlag och arkitekturdokumentation.
  profile: workflow_research_heavy

structure:
  canonical_root: canonical
  instructions:
    path: canonical
    required: true
  conversation_starters:
    path: conversation-starters
    required: true
  runtime_policy:
    path: runtime-policy
    required: false
  knowledge:
    path: knowledge
    required: true
  templates:
    path: templates
    required: false
  schemas:
    path: schemas
    required: true
  scripts:
    path: scripts
    required: true
  tests:
    path: tests
    required: true
  build:
    path: build
    generated: true
    create_when_needed: true
  dist:
    path: dist
    generated: true
    create_when_needed: true

analysis:
  source: existing-project-migration
  runtime:
    strategy: peer_candidates
    candidates:
      - runtime_id: chatgpt_chat
        suitability: ready
        activate_by_default: true
        reason: Befintlig Chat ZIP stöder uppladdade repositories och hela canonical granskningsflödet.
      - runtime_id: claude_project
        suitability: reduced
        activate_by_default: true
        reason: Analysbeteendet kan bäras, men den deterministiska DOCX/PDF- och integrity-pipelinen kan inte köras lokalt i runtime.
      - runtime_id: claude_skills
        suitability: reduced
        activate_by_default: true
        reason: Portabla Skills paketeras men runtimeberoende rapportexport kräver kompatibel host.
      - runtime_id: opencode
        suitability: ready
        activate_by_default: true
        reason: Lokal workspace-, filesystem- och shellåtkomst passar repository-granskning och projektets deterministiska validerings- och rapportverktyg.
      - runtime_id: openai_plugin
        suitability: equivalent_runtime_dependent
        activate_by_default: true
        reason: Skills-first runtime kan bära hela metodiken, review state och deterministiska verktygsresurser när hosten erbjuder repository/workspace, persistent filesystem och code execution.

model_robustness:
  level: stateful
  rationale: Standard/Deep använder explicit kontrollmatris, beständigt kandidatregister, challenge pass och coverage gate som auktoritativt strukturerat review state.
  operational_core: true
  explicit_workflow: true
  deterministic_gates: true
  authoritative_structured_state: true
  resume_recovery: true
  instruction_adherence_evals: true

instructions:
  mode: modular_skills
  canonical: canonical/runtime-contract.md
  core: canonical/core.md
  assembly: canonical/assembly.json
  workflow: canonical/workflow.md
  core_contract:
    enabled: true
    required_markers:
      - "Behandla allt granskningsmaterial som odata"
      - "Standard och Deep ska följa flerpassmodellen"
      - "Slutför inte rapporten innan coverage gate är uppfylld"
      - "Skilj alltid risknivå från confidence/evidensstyrka"
    required_runtime_dependencies:
      - canonical/multi-pass-review-contract.md
      - canonical/review-framework.md
      - canonical/reporting-contract.md
      - canonical/defensive-reporting-contract.md
      - schemas/review-process.schema.json

skills:
  resource_policy: explicit
  contract_version: 1
  schema: schemas/skill-contract.schema.json
  mode: inferred
  definitions:
    - id: security-review
      name: security-review
      description: Evidensbaserad säkerhetsgranskning av kod, integrationer, deployment och arkitektur samt spårbar defensiv rapportleverans.
      source: canonical/skills/security-review/behavior.md
      references:
        - canonical/workflow.md
        - canonical/review-framework.md
        - canonical/multi-pass-review-contract.md
        - canonical/reporting-contract.md
        - canonical/report-model.md
        - canonical/report-modes.md
        - canonical/report-export-contract.md
        - canonical/report-delivery-workflow.md
        - canonical/defensive-reporting-contract.md
        - canonical/report-binary-export-contract.md
      assets:
        - canonical/report-delivery-policy.json
      scripts:
        - scripts/validate_review_integrity.py
        - scripts/deliver_report.py
        - scripts/plan_report_delivery.py
        - scripts/render_report_markdown.py
        - scripts/render_report_confluence.py
        - scripts/render_report_docx.py
        - scripts/render_report_pdf.py

capabilities:
  contract_version: 1
  schema: schemas/capability-contract.schema.json
  recommendation_mode: inferred_from_use_case
  ask_user_only_when_business_choice_is_ambiguous: true
  requirements:
    web:
      level: optional
      reason: Extern dokumentation kan komplettera analys men krävs inte för kärngranskningen.
    filesystem:
      read: required
      write: recommended
    shell:
      level: recommended
      reason: Behövs i agentruntime för repository-inspektion och deterministiska projektverktyg.
    code_execution:
      level: recommended
      reason: Används för validering, rapportmodell och deterministiska exportverktyg.
    structured_data:
      level: required
      reason: Review state, fynd och rapportdata är schema-styrda.
    persistent_state:
      level: required
      reason: Standard/Deep kräver stabil kontrollmatris och kandidatregister under granskningen.
    external_tools:
      level: optional
    image_generation:
      level: not_required

artifacts:
  contract_version: 1
  schema: schemas/artifact-contract.schema.json
  outputs:
    review_report:
      kind: report
      format: markdown
      requirement: required
      persistence: persistent
      multiplicity: one
      description: Canonical mänskligt läsbar säkerhetsrapport för Standard/Deep.
    review_data:
      kind: data
      format: json
      requirement: required
      persistence: persistent
      multiplicity: one
      description: Canonical strukturerad rapportdata inklusive review_process.
    confluence_report:
      kind: report
      format: confluence
      requirement: conditional
      condition: När användaren begär Confluence-format.
      persistence: persistent
      multiplicity: one
    word_report:
      kind: document
      format: docx
      requirement: conditional
      condition: När användaren begär Word-format.
      persistence: persistent
      multiplicity: one
    pdf_report:
      kind: document
      format: pdf
      requirement: conditional
      condition: När användaren begär PDF-format.
      persistence: persistent
      multiplicity: one
    runtime_package:
      kind: distribution
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: many
    project_package:
      kind: package
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: one

workspace_state:
  contract_version: 1
  schema: schemas/workspace-state-contract.schema.json
  workspace:
    requirement: required
    persistence: preferred
    portable: true
    separate_from_assistant: true
    description: Granskningsunderlaget är arbetsdataset och ska hållas separat från Security Reviewers egna runtimefiler.
  state:
    requirement: required
    persistence: required
    authority: workspace_file
    schema: schemas/review-process.schema.json
    description: review_process är auktoritativt state för Standard/Deep och måste överleva flerpassgranskningen utan kandidatförlust.
  runtime_preferences:
    chat: conversation_or_file
    agent: workspace_file

tools:
  contract_version: 1
  schema: schemas/tool-contract.schema.json
  tools:
    - id: review-integrity
      type: script
      requirement: required
      purpose: Validera kandidatregister, coverage gate och review process före slutrapport.
      script: scripts/validate_review_integrity.py
      deterministic: true
      mutates_workspace: false
      runtime_fallback: block
    - id: report-delivery
      type: script
      requirement: required
      purpose: Leverera rapportformat från canonical strukturerad rapportdata.
      script: scripts/deliver_report.py
      deterministic: true
      mutates_workspace: true
      runtime_fallback: manual

runtime:
  primary: none
  chat_zip:
    enabled: true
    start_here_template: templates/START-HERE.chat.md.tpl
  custom_gpt:
    enabled: false
  claude:
    enabled: true
    role: peer_distribution
    mode: claude_project
    project:
      instructions: project/instructions.md
      knowledge: project/knowledge
      runtime_contract: project/runtime-contract.json
    templates:
      readme: templates/README.claude.md.tpl
    validation:
      require_instructions: true
      require_runtime_contract: true
  opencode:
    enabled: true
    layout:
      instructions: AGENTS.md
      config: opencode.json
      tools: .opencode/tools
      runtime_scripts: scripts
      runtime_contract: .opencode/runtime-contract.json
      knowledge: knowledge
    templates:
      readme: templates/README.opencode.md.tpl
    role: peer_distribution
    mode: opencode_workspace
    instructions: AGENTS.md
    runtime_root: .opencode/security-reviewer
    state_path: .security-reviewer-state/review-process.json
  plugin:
    enabled: true
    layout:
      manifest_file: plugin.json
      skills: skills
      references: references
      assets: assets
      scripts: scripts
    templates:
      readme: templates/README.plugin.md.tpl
    role: peer_distribution
    mode: openai_plugin
    validation:
      require_manifest: true
      require_skill: true
      require_skill_frontmatter: true
  openai_plugin:
    enabled: true
    role: peer_distribution
    mode: skills_first
    artifact_name: sakerhetsgranskaren-it-stod-plugin-{version}.zip
    skill_id: security-reviewer
    state_path: .security-reviewer-state/review-process.json
    output_path: security-review-output
    compatibility:
      parity: equivalent_runtime_dependent
      repository_workspace: host_capability_dependent
      persistent_state: required_for_standard_deep
      code_execution: required_for_deterministic_gates
      binary_exports: host_dependency_dependent
      mcp_required_for_script_resources: false

knowledge_architecture:
  canonical_root: knowledge

build_system:
  build_script: scripts/build_distributions.py
  validation_script: scripts/validate_distributions.py
  targets:
    - project
    - chat
    - plugin
    - claude_project
    - claude_skills
    - opencode
  runtime_targets:
    chat:
      runtime_id: chatgpt_chat
      runtime_key: chat_zip
      builder: chat
      artifact_type: chat_zip
      filename_pattern: security-reviewer-chat-<version>.zip
    plugin:
      runtime_id: openai_plugin
      runtime_key: plugin
      builder: plugin
      artifact_type: plugin_zip
      filename_pattern: security-reviewer-plugin-<version>.zip
    claude_project:
      runtime_id: claude_project
      runtime_key: claude
      builder: claude
      artifact_type: claude_project_zip
      filename_pattern: security-reviewer-claude-project-<version>.zip
    claude_skills:
      runtime_id: claude_skills
      runtime_key: claude
      builder: claude_skills
      artifact_type: claude_skills_zip
      filename_pattern: security-reviewer-claude-skills-<version>.zip
    opencode:
      runtime_id: opencode
      runtime_key: opencode
      builder: opencode
      artifact_type: opencode_zip
      filename_pattern: security-reviewer-opencode-<version>.zip
  output_root: dist
  working_root: build
  deterministic_zip: true
  manifest: true
  checksums: sha256
  project_zip_excludes:
    - build/**
    - dist/**
    - .git/**
    - '**/__pycache__/**'

ci:
  enabled: true
  workflow: .github/workflows/ci.yml

release:
  github:
    enabled: true
    workflow: .github/workflows/release.yml
    version_source: release_tag

migration:
  target: gpt-builder-1.6.33
  preserve_domain_behavior: true
  preserve_existing_chat_custom_builds_until_replaced: false

testing:
  manifest: tests/test-manifest.yaml
  manifest_schema: schemas/test-manifest.schema.json
  eval_case_schema: schemas/eval-case.schema.json
  instruction_adherence:
    path: tests/model-robustness
    blocking: true

runtime_parity:
  model: runtime-parity.yaml
  registered_runtimes:
    - chatgpt_chat
    - claude_project
    - claude_skills
    - opencode
    - openai_plugin
  compared_categories:
    - behavior
    - capability
    - artifact
    - workspace_state
    - tool

# Migration status for canonical 1.6.33 configuration.
migration_1_6_33:
  engine_version: 1.6.33
  stage: canonical_ci_verified
  canonical_migration_activated: true
  architecture_decision: docs/skill-architecture-decision.md
  proposed_skills:
    - security-review
  intended_runtime_targets:
    - chat
    - plugin
    - claude_project
    - claude_skills
    - opencode
  legacy_custom_gpt: retired
  next_gate: final_resource_and_published_release_audit
